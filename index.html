<!DOCTYPE html>
<html lang="pl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#07070a" />
  <title>ApexAI — AI Race Engineer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF2D3A'/%3E%3Cpath d='M16 6 L25 24 H20.5 L18.4 19 H13.6 L11.5 24 H7 L16 6 Z M14.2 16.5 H17.8 L16 12 L14.2 16.5 Z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Mobile header -->
    <header class="mobile-header">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="mobile-logo">
        <div class="logo-icon" style="padding:0;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="128" y2="128"><stop stop-color="#FF2D3A"/><stop offset="1" stop-color="#C1121F"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="url(#ag)"/><path d="M64 28 L96 96 H80 L72.5 78 H55.5 L48 96 H32 L64 28 Z M58 68 H70 L64 52 L58 68 Z" fill="#fff"/><path d="M36 108 H92" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".35"/></svg></div>
        <span class="logo-text">ApexAI</span>
      </div>
      <div class="mobile-status">
        <span class="status-dot online"></span>
      </div>
    </header>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="logo-icon" style="padding:0;overflow:hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="128" y2="128"><stop stop-color="#FF2D3A"/><stop offset="1" stop-color="#C1121F"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="url(#ag)"/><path d="M64 28 L96 96 H80 L72.5 78 H55.5 L48 96 H32 L64 28 Z M58 68 H70 L64 52 L58 68 Z" fill="#fff"/><path d="M36 108 H92" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".35"/></svg></div>
        <span class="logo-text">ApexAI</span>
        <span class="version-badge">v0.2</span>
      </div>

      <nav class="nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="sessions">
          <span class="nav-icon">🏁</span>
          <span>Sessions</span>
        </a>
        <a href="#" class="nav-item" data-page="telemetry">
          <span class="nav-icon">📊</span>
          <span>Telemetry</span>
        </a>
        <a href="#" class="nav-item" data-page="coach">
          <span class="nav-icon">🧠</span>
          <span>AI Coach</span>
        </a>
        <a href="#" class="nav-item" data-page="setup">
          <span class="nav-icon">🔧</span>
          <span>Setup AI</span>
        </a>
        <a href="#" class="nav-item" data-page="profile">
          <span class="nav-icon">👤</span>
          <span>Driver Profile</span>
        </a>
        <a href="#" class="nav-item" data-page="progress">
          <span class="nav-icon">📈</span>
          <span>Progress</span>
        </a>
        <a href="#" class="nav-item" data-page="settings">
          <span class="nav-icon">⚙</span>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="status">
          <span class="status-dot online"></span>
          <span class="status-text">ONLINE</span>
        </div>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="pl">PL</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <div class="game-badge">
            <span class="game-dot"></span>
            <span class="game-name">Assetto Corsa Competizione</span>
          </div>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Pages injected here -->
      </div>
    </main>

    <!-- Mobile bottom navigation -->
    <nav class="bottom-nav" id="bottom-nav">
      <a href="#" class="bottom-nav-item active" data-page="dashboard">
        <span class="bn-icon">⌂</span>
        <span class="bn-label">Home</span>
      </a>
      <a href="#" class="bottom-nav-item" data-page="sessions">
        <span class="bn-icon">🏁</span>
        <span class="bn-label">Sessions</span>
      </a>
      <a href="#" class="bottom-nav-item" data-page="telemetry">
        <span class="bn-icon">📊</span>
        <span class="bn-label">Data</span>
      </a>
      <a href="#" class="bottom-nav-item" data-page="coach">
        <span class="bn-icon">🧠</span>
        <span class="bn-label">Coach</span>
      </a>
      <a href="#" class="bottom-nav-item" data-page="profile">
        <span class="bn-icon">👤</span>
        <span class="bn-label">Profile</span>
      </a>
    </nav>
  </div>

  <script src="src/data/mock.js"></script>
  <script src="src/utils/analysis.js"></script>
  <script src="src/utils/telemetry-client.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
